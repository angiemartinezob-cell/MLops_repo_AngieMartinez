# Configuración de SonarCloud
# Verifique en SonarCloud (Information del proyecto) que la organización y la llave coincidan.
sonar.organization=angiemartinezob-cell
sonar.projectKey=angiemartinezob-cell_MLops_repo_AngieMartinez
sonar.projectName=MLops_repo_AngieMartinez

sonar.sources=mlops_pipeline
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Reportes generados por pytest en GitHub Actions
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Los notebooks son análisis exploratorio: se revisan, pero no cuentan para cobertura
sonar.coverage.exclusions=**/*.ipynb
